<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场景工作台 · 离线原型</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>场景工作台</strong><nav id="sectionTabs" class="section-tabs"></nav><div id="breadcrumb"></div><span id="frequencyBadge"></span><button id="run" class="primary">▶ 模拟运行</button><details class="more"><summary>更多</summary><div class="menu"><button id="exportJson">导出配置</button><label class="file">导入配置<input id="importJson" type="file" accept=".json,application/json"></label><button id="handoff">导出交接包</button><button id="snapshot">保存快照</button></div></details></header>
<main id="workspace"><aside id="sidebar"><button id="toggleSidebar" title="收起或展开侧栏">☰ <span>收起侧栏</span></button><div class="sidebar-content"><div class="scene-heading"><strong>场景</strong><button id="newScene">＋ 新建场景</button></div><div id="navigation"></div></div></aside><aside id="frameColumn"><button id="toggleFrames">收起截图</button><div id="frameContent"><h2 id="frameTitle">截图序列</h2><label class="file">批量导入截图<input id="framesInput" type="file" accept="image/*" multiple></label><div id="frames"></div></div><div id="frameRail" class="frame-rail" aria-label="截图缩略图"></div></aside>
<section class="canvas-section"><div class="toolbar"><div class="segmented"><button data-tool="point">取点</button><button data-tool="roi">区域</button><button data-tool="template">参考图</button><button id="addText">文字</button></div><button id="fitView">适应</button><button id="actualView">100%</button><button id="resetView">复位</button><span id="zoomValue"></span></div><div id="canvasArea" class="canvas-area"><aside id="frameElements" class="frame-elements"><div class="element-head"><strong>本帧识别物</strong><button id="elementSide" title="切换左右">⇄</button><button id="elementCollapse" title="收起或展开">收起</button></div><div class="element-filters"><input id="elementSearch" placeholder="搜索中文名"><select id="elementType"><option value="">全部类型</option><option value="point">取点</option><option value="roi">识别区域</option><option value="template">参考图</option><option value="text">文字识别</option></select></div><div id="frameElementList"></div></aside><div class="canvas-wrap"><canvas id="screen" width="2772" height="1280"></canvas><div id="popover" class="popover" hidden><button id="closePopover">关闭</button><div id="elements"></div></div></div></div><p id="coords">移动鼠标查看逻辑坐标</p><p class="hint">滚轮缩放；空格或中键拖动画面。点击已有标注可编辑。模板裁剪为占位。</p></section>
<aside class="right"><nav class="tabs"><button data-tab="flow" class="active">流程</button><button data-tab="library">识别物</button><button data-tab="settings">设置</button></nav><section id="tab-flow"><h2>流程说明</h2><textarea id="description" placeholder="例如：进入邮件，领取后关闭窗口。"></textarea><button disabled>生成步骤（待对接）</button><details><summary>高级：手动编辑步骤（通常不用管）</summary><h2>操作流程</h2><p class="hint">分支条件仅记录，模拟时手动选择。原型不执行安全校验。</p><details open><summary>分支</summary><select id="branchSelect"></select><button id="addBranch">＋ 添加分支</button><div id="branchDetails"></div></details><div class="toolbar"><select id="stepType"><option value="tap">点击</option><option value="waitImage">等待图片</option><option value="waitText">等待文字</option><option value="waitMs">等待时间</option><option value="swipe">滑动</option><option value="snapshot">记录快照</option></select><button id="addStep">＋ 添加步骤</button></div><div id="steps"></div></details><div id="runStatus" role="status"></div></section>
<section id="tab-library" hidden><h2>跨帧识别物库</h2><div id="elementList"></div></section><section id="tab-settings" hidden><h2>场景设置</h2><label>场景名 <input id="recipeName"></label><label>执行频率<select id="schedule"><option value="repeat">可重复执行</option><option value="daily">每天一次</option></select></label><label>默认档位<select id="recipeTier"><option value="A">A档·资源相关</option><option value="B">B档·日常白嫖</option></select></label><label>入口描述<input id="entryDesc"></label><label>失败策略<select id="onFail"><option value="skipAndLog">失败：跳过记录</option><option value="abort">失败：中止</option></select></label><h3>版本快照</h3><div id="snapshots"></div><pre id="diff"></pre><details><summary>高级（折叠）</summary><label>内部 ID<input id="recipeId" readonly></label><details><summary>机器配置（高级）</summary><div class="toolbar"><button id="editJson">编辑 JSON</button><button id="applyJson" hidden>应用 JSON</button><button id="cancelJson" hidden>取消</button></div><textarea id="json" readonly spellcheck="false"></textarea></details></details></section></aside></main>
<dialog id="newDialog"><form id="newForm"><h2 id="sceneDialogTitle">新建场景</h2><label>名称<input id="newName" required></label><label>所属板块<select id="newSection"><option value="daily">日常任务</option><option value="dunhuang">敦煌密窟</option><option value="event">特殊活动</option></select></label><label>执行频率<select id="newSchedule"><option value="repeat">可重复执行</option><option value="daily">每天一次</option></select></label><label>排序权重<input id="newOrder" type="number" required></label><label>入口描述<input id="newEntry"></label><label>失败策略<select id="newOnFail"><option value="skipAndLog">失败：跳过记录</option><option value="abort">失败：中止</option></select></label><button id="sceneSubmit" type="submit">创建</button><button id="cancelNew" type="button">取消</button></form></dialog><dialog id="frameDialog"><form id="frameForm"><h2>编辑截图</h2><label>名称<input id="frameName" required></label><label>备注<textarea id="frameNote"></textarea></label><label>排序权重<input id="frameOrder" type="number" required></label><button type="submit">保存</button><button type="button" id="cancelFrame">取消</button></form></dialog><script src="app.js"></script></body></html>
